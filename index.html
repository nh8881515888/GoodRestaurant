<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍성 착한가격업소 조회</title>
</head>

<body>
    <h1>홍성 착한가격업소 목록</h1>
    <div id="data-container">데이터를 불러오는 중...</div>

    <script>
        // 1단계에서 배포한 구글 웹 앱 URL을 여기에 붙여넣습니다.
        const GAS_URL = "https://script.google.com/macros/s/XXXXX/exec";

        async function loadData() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();

                // 받아온 2차원 배열 데이터(B1:I6)를 화면에 표시하는 로직 작성
                console.log(data);

                let html = "<table border='1'>";
                data.forEach((row, index) => {
                    html += "<tr>";
                    row.forEach(cell => {
                        html += index === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
                    });
                    html += "</tr>";
                });
                html += "</table>";

                document.getElementById('data-container').innerHTML = html;
            } catch (error) {
                document.getElementById('data-container').innerText = "데이터를 불러오지 못했습니다.";
                console.error(error);
            }
        }

        // 페이지 로드 시 데이터 가져오기 실행
        loadData();
    </script>
</body>

</html>
